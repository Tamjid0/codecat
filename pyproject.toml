[project]
name = "codecat"
version = "1.0.0"
description = "CodeCat Risk2Fix Auditor — Micro1 Frontier Engineering Challenge 2026"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name="Tamjid", email="tamjid@example.com"}]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "scipy>=1.13.0",  # for Spearman
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "types-requests",
]

[project.scripts]
codecat = "codecat.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
